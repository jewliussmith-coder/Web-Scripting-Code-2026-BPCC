<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Silent Disco</title>
    <style>
        #dance-floor {
            width: 600px;
            height: 400px;
            background-color: black;
            position: relative;
        }

        .panel {
            width: 100px;
            height: 100px;
            display: inline-block;
            margin: 20px;
        }

        #panel1 {
            background-color: red;
        }

        #panel2 {
            background-color: blue;
        }

        #dancer {
            position: absolute;
            top: 180px;
            left: 280px;
            font-size: 50px;
        }
    </style>
</head>
<body>

    <div id="dance-floor">
        <div id="panel1" class="panel"></div>
        <div id="panel2" class="panel"></div>
        <span id="dancer">🕺</span>
    </div>

    <script src="script.js"></script>
</body>
</html>
